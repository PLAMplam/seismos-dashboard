<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEISMOS — Live Earthquake Monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@500;700;900&display=swap');

  :root{
    --ink:#0c1210;
    --panel:#121a17;
    --panel-2:#0f1613;
    --line:#243530;
    --paper:#e9e4d8;
    --paper-dim:#8f9a92;
    --calm:#4fb8a6;
    --warn:#e0a94a;
    --hot:#d9603f;
    --crit:#e23f3f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;}

  .app{display:grid;grid-template-columns: 380px 1fr; grid-template-rows: auto 1fr; height:100vh;}
  @media (max-width: 860px){ .app{grid-template-columns: 1fr; grid-template-rows: auto auto 1fr;} #map{min-height:340px;} }

  header{
    grid-column: 1 / -1;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    border-bottom:1px solid var(--line);
    background: linear-gradient(180deg, #141d1a, #101613);
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand h1{
    font-family:'Archivo',sans-serif; font-weight:900; font-size:22px; letter-spacing:0.5px;
    margin:0; color:var(--paper);
  }
  .brand .tag{font-size:11px; color:var(--paper-dim); letter-spacing:2px; text-transform:uppercase;}
  .pulse{
    display:flex; align-items:center; gap:8px; font-size:11px; color:var(--calm); letter-spacing:1px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--calm); box-shadow:0 0 0 0 rgba(79,184,166,0.6); animation: ping 2s infinite;}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(79,184,166,0.5);}
    70%{box-shadow:0 0 0 8px rgba(79,184,166,0);}
    100%{box-shadow:0 0 0 0 rgba(79,184,166,0);}
  }

  .sidebar{
    border-right:1px solid var(--line);
    background:var(--panel);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .controls{padding:16px 20px; border-bottom:1px solid var(--line); background:var(--panel-2);}
  .controls .row{display:flex; gap:8px; margin-bottom:10px;}
  .controls label{font-size:10px; color:var(--paper-dim); letter-spacing:1.5px; text-transform:uppercase; display:block; margin-bottom:6px;}
  select, button.opt{
    background:var(--ink); color:var(--paper); border:1px solid var(--line);
    font-family:'Space Mono',monospace; font-size:12px; padding:8px 10px; border-radius:3px; flex:1;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex:1;}
  .seg button{
    flex:1; background:var(--ink); color:var(--paper-dim); border:none; border-right:1px solid var(--line);
    font-family:'Space Mono',monospace; font-size:11px; padding:8px 4px; cursor:pointer; transition:.15s;
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--hot); color:#160b08; font-weight:700;}
  .seg button:hover:not(.active){background:#182420;}

  .stats{display:flex; gap:1px; background:var(--line); margin-top:4px;}
  .stat{flex:1; background:var(--panel-2); padding:10px 12px; text-align:center;}
  .stat .n{font-family:'Archivo',sans-serif; font-weight:900; font-size:20px;}
  .stat .l{font-size:9px; color:var(--paper-dim); letter-spacing:1px; text-transform:uppercase; margin-top:2px;}

  .list{overflow-y:auto; flex:1;}
  .list::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .item{
    display:flex; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line);
    cursor:pointer; transition:.12s; align-items:center;
  }
  .item:hover{background:var(--panel-2);}
  .item.selected{background:#182722; border-left:3px solid var(--hot); padding-left:17px;}
  .mag-badge{
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Archivo',sans-serif; font-weight:900; font-size:15px; flex-shrink:0; color:#0c1210;
  }
  .item-info{flex:1; min-width:0;}
  .item-place{font-size:12px; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-meta{font-size:10px; color:var(--paper-dim); margin-top:3px;}

  #map{width:100%; height:100%; background:#0c1210;}
  .leaflet-container{background:#0c1210 !important;}

  .empty, .loading{padding:40px 20px; text-align:center; color:var(--paper-dim); font-size:12px;}
  .loading .dot{margin:0 auto 10px;}

  .legend{
    position:absolute; bottom:20px; right:20px; z-index:500;
    background:rgba(15,22,19,0.92); border:1px solid var(--line); border-radius:4px;
    padding:12px 14px; font-size:10px; color:var(--paper-dim);
    backdrop-filter: blur(4px);
  }
  .legend .row2{display:flex; align-items:center; gap:6px; margin:4px 0;}
  .legend .sw{width:9px; height:9px; border-radius:50%;}

  .custom-popup .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
  }
  .custom-popup .leaflet-popup-tip {
    background: var(--panel);
    border: 1px solid var(--line);
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>SEISMOS</h1>
      <span class="tag">Live Earthquake Monitor</span>
    </div>
    <div style="display:flex; align-items:center; gap:18px;">
      <button id="sound-toggle" style="background:var(--ink); border:1px solid var(--line); color:var(--paper-dim); font-family:'Space Mono',monospace; font-size:11px; padding:7px 12px; border-radius:3px; cursor:pointer; letter-spacing:1px; display:flex; align-items:center; gap:6px;">
        <span id="sound-icon">🔕</span> ALERT SOUND: OFF
      </button>
      <div class="pulse"><span class="dot"></span><span id="pulse-text">CONNECTING TO USGS FEED</span></div>
    </div>
  </header>

  <div class="sidebar">
    <div class="controls">
      <div class="row">
        <div style="flex:1">
          <label>Time window</label>
          <div class="seg" id="window-seg">
            <button data-v="hour">1H</button>
            <button data-v="day" class="active">24H</button>
            <button data-v="week">7D</button>
            <button data-v="month">30D</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div style="flex:1">
          <label>Minimum magnitude</label>
          <div class="seg" id="mag-seg">
            <button data-v="0">ALL</button>
            <button data-v="2.5" class="active">2.5+</button>
            <button data-v="4.5">4.5+</button>
            <button data-v="6">6.0+</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div style="flex:1">
          <label>Jump to region</label>
          <div class="seg" id="region-seg">
            <button data-lat="13.7" data-lon="100.5" data-zoom="5">THAILAND</button>
            <button data-lat="4.5" data-lon="108" data-zoom="4">ASEAN</button>
            <button data-lat="20" data-lon="0" data-zoom="2">WORLD</button>
          </div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n" id="stat-total">—</div><div class="l">Events</div></div>
        <div class="stat"><div class="n" id="stat-max">—</div><div class="l">Max Mag</div></div>
        <div class="stat"><div class="n" id="stat-recent">—</div><div class="l">Last Hr</div></div>
      </div>
    </div>
    <div class="list" id="list">
      <div class="loading"><div class="dot" style="animation:ping 1s infinite;"></div>Reading seismograph…</div>
    </div>
  </div>

  <div style="position:relative;">
    <div id="map"></div>
    <div class="legend">
      <div style="font-size:9px; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; color:var(--paper);">Magnitude</div>
      <div class="row2"><span class="sw" style="background:var(--calm)"></span>&lt; 3.0</div>
      <div class="row2"><span class="sw" style="background:var(--warn)"></span>3.0 – 4.9</div>
      <div class="row2"><span class="sw" style="background:var(--hot)"></span>5.0 – 5.9</div>
      <div class="row2"><span class="sw" style="background:var(--crit)"></span>6.0 +</div>
    </div>
  </div>
</div>

<script>
const map = L.map('map', {zoomControl:true, worldCopyJump:true}).setView([13.7, 100.5], 3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 18
}).addTo(map);

let markersMap = new Map();
let currentWindow = 'day';
let currentMinMag = 2.5;
let quakes = [];
let soundEnabled = false;
let seenIds = new Set();
let firstLoad = true;
let selectedId = null;
const ALERT_THRESHOLD = 5.0;

const USGS_FEEDS = {
  hour: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson',
  day: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',
  week: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson',
  month: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson'
};

const soundBtn = document.getElementById('sound-toggle');
soundBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-icon').innerText = soundEnabled ? '🔔' : '🔕';
  soundBtn.childNodes[1].nodeValue = soundEnabled ? ' ALERT SOUND: ON' : ' ALERT SOUND: OFF';
  soundBtn.style.borderColor = soundEnabled ? 'var(--calm)' : 'var(--line)';
  soundBtn.style.color = soundEnabled ? 'var(--calm)' : 'var(--paper-dim)';
  if(soundEnabled) playAlertTone(5.0);
});

function playAlertTone(mag){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beeps = mag >= 6 ? 3 : 2;
    for(let i = 0; i < beeps; i++){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = mag >= 6 ? 880 : 660;
      gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.35);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + i * 0.35 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.35 + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.35);
      osc.stop(ctx.currentTime + i * 0.35 + 0.3);
    }
  }catch(e){ console.error('Audio alert failed', e); }
}

function magColor(m){
  if(m >= 6) return '#e23f3f';
  if(m >= 5) return '#d9603f';
  if(m >= 3) return '#e0a94a';
  return '#4fb8a6';
}

function timeAgo(ts){
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if(min < 1) return 'just now';
  if(min < 60) return min + 'm ago';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr + 'h ago';
  return Math.floor(hr/24) + 'd ago';
}

function clearMarkers(){
  markersMap.forEach(m => map.removeLayer(m));
  markersMap.clear();
}

function render(){
  clearMarkers();
  const list = document.getElementById('list');
  const filtered = quakes.filter(q => q.mag >= currentMinMag);

  document.getElementById('stat-total').innerText = filtered.length;
  if(filtered.length > 0){
    const maxM = Math.max(...filtered.map(q => q.mag));
    document.getElementById('stat-max').innerText = maxM.toFixed(1);
    const oneHrAgo = Date.now() - (3600 * 1000);
    const recentCnt = filtered.filter(q => q.time >= oneHrAgo).length;
    document.getElementById('stat-recent').innerText = recentCnt;
  } else {
    document.getElementById('stat-max').innerText = '—';
    document.getElementById('stat-recent').innerText = '0';
  }

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">No events matching filter constraints.</div>`;
    return;
  }

  let html = '';
  filtered.forEach(q => {
    const color = magColor(q.mag);
    const radius = Math.max(4, Math.pow(q.mag, 1.8) * 1.2);
    
    const marker = L.circleMarker([q.lat, q.lon], {
      radius: radius,
      fillColor: color,
      color: color,
      weight: 1,
      opacity: 0.8,
      fillOpacity: 0.45
    }).addTo(map);

    const popupContent = `
      <div style="font-size:12px; font-weight:700; margin-bottom:4px; color:${color}">MAG ${q.mag.toFixed(1)}</div>
      <div style="font-size:11px; margin-bottom:6px;">${q.place}</div>
      <div style="font-size:10px; color:var(--paper-dim)">Depth: ${q.depth} km</div>
      <div style="font-size:10px; color:var(--paper-dim)">Time: ${new Date(q.time).toLocaleTimeString()}</div>
    `;
    marker.bindPopup(popupContent, {className: 'custom-popup'});

    marker.on('click', () => {
      selectQuake(q.id, false);
    });

    markersMap.set(q.id, marker);

    const isSelected = q.id === selectedId ? 'selected' : '';
    html += `
      <div class="item ${isSelected}" id="item-${q.id}" onclick="selectQuake('${q.id}', true)">
        <div class="mag-badge" style="background:${color}">${q.mag.toFixed(1)}</div>
        <div class="item-info">
          <div class="item-place" title="${q.place}">${q.place}</div>
          <div class="item-meta">${timeAgo(q.time)} • ${q.depth}km deep</div>
        </div>
      </div>
    `;
  });

  list.innerHTML = html;
}

function selectQuake(id, panTo = true){
  selectedId = id;
  const q = quakes.find(item => item.id === id);
  if(!q) return;

  document.querySelectorAll('.item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(`item-${id}`);
  if(el){
    el.classList.add('selected');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const marker = markersMap.get(id);
  if(marker){
    if(panTo) map.panTo([q.lat, q.lon]);
    marker.openPopup();
  }
}

async function fetchQuakes(){
  document.getElementById('pulse-text').innerText = 'UPDATING USGS FEED';
  try {
    const res = await fetch(USGS_FEEDS[currentWindow]);
    const data = await res.json();
    
    quakes = data.features.map(f => ({
      id: f.id,
      mag: f.properties.mag || 0,
      place: f.properties.place || 'Unknown location',
      time: f.properties.time,
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0],
      depth: f.geometry.coordinates[2]
    })).sort((a,b) => b.time - a.time);

    if(!firstLoad && soundEnabled){
      quakes.forEach(q => {
        if(!seenIds.has(q.id) && q.mag >= ALERT_THRESHOLD){
          playAlertTone(q.mag);
        }
      });
    }

    quakes.forEach(q => seenIds.add(q.id));
    firstLoad = false;
    
    document.getElementById('pulse-text').innerText = 'LIVE FEED ACTIVE';
    render();
  } catch(e) {
    console.error(e);
    document.getElementById('pulse-text').innerText = 'FEED DISCONNECTED';
  }
}

function bindSegment(id, callback) {
  const container = document.getElementById(id);
  container.addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
      container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      callback(e.target);
    }
  });
}

bindSegment('window-seg', (btn) => {
  currentWindow = btn.dataset.v;
  fetchQuakes();
});

bindSegment('mag-seg', (btn) => {
  currentMinMag = parseFloat(btn.dataset.v);
  render();
});

document.getElementById('region-seg').addEventListener('click', (e) => {
  if(e.target.tagName === 'BUTTON'){
    const lat = parseFloat(e.target.dataset.lat);
    const lon = parseFloat(e.target.dataset.lon);
    const zoom = parseInt(e.target.dataset.zoom);
    map.flyTo([lat, lon], zoom);
  }
});

fetchQuakes();
setInterval(fetchQuakes, 60000);
</script>
</body>
</html>
